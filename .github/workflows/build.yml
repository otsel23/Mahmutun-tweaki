name: Mahmut Tweak Derle

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Theos kur
        uses: Randomblock1/theos-action@v1

      - name: Derle
        run: make package

      - name: Paketi yükle
        uses: actions/upload-artifact@v4
        with:
          name: MahmutTweak
          path: packages/*.deb
